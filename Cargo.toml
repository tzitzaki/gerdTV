# gerdTV Rust workspace. All logic lives in gerdtv-core; gerdtv-api is the thin flutter_rust_bridge surface.
# The version is set by the wrap-up PR (0.YYMMDD.<PR#>, docs/RELEASING.md) together with app/pubspec.yaml.
[workspace]
resolver = "3"
members = ["crates/gerdtv-core", "crates/gerdtv-api", "crates/gerdtv-testkit", "crates/gerdtv-release"]

[workspace.package]
version = "0.261122.31"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
gerdtv-core = { path = "crates/gerdtv-core" }
ed25519-dalek = "3.0.0"
sha2 = "0.11.1"
serde_json = "1"
tracing = "0.1.44"
thiserror = "2.0.21"
quick-xml = "0.42.0"
flate2 = "1.1.11"
serde = { version = "1.0.229", features = ["derive"] }
# TLS via rustls with the ring provider (no C toolchain for Android/iOS cross builds, unlike aws-lc-rs).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "gzip", "stream", "http2", "charset", "query"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
criterion = "0.8.2"
libmpv2 = "7.0.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }

[workspace.lints.clippy]
# CI and `just ready` run clippy with -D warnings; nothing extra is enabled here on purpose.

[profile.release]
# Smaller, faster native library for the app; the core has no panics we rely on unwinding for.
lto = "thin"
