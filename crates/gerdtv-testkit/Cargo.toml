[package]
name = "gerdtv-testkit"
description = "gerdTV test kit: synthetic data, mock servers, fault injection, and the repository rule tests."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ed25519-dalek.workspace = true
sha2.workspace = true
serde_json.workspace = true
tokio.workspace = true

[lints]
workspace = true

[dev-dependencies]
# The libmpv harness (tests/libmpv_watchdog.rs): real libmpv driven by the real watchdog. Dev-only, so the
# library itself never links libmpv. (gerdtv-core dev-depends on this crate too; Cargo allows that cycle for dev.)
gerdtv-core = { path = "../gerdtv-core" }
libmpv2.workspace = true
