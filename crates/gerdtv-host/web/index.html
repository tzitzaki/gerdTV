<!doctype html>
<!-- gerdTV web player (served by gerdtv-host; app.js has the logic). Plain HTTP on purpose: the browser plays the
     provider's http:// streams directly, which an HTTPS page may not. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12121a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>gerdTV</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<nav id="rail">
  <div class="logo">g<b>TV</b></div>
  <button data-section="live" class="active"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 6h-7.59l3.29-3.29L16 2l-4 4-4-4-.71.71L10.59 6H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zm0 14H3V8h18v12z"/></svg><span data-t="tv">TV</span></button>
  <button data-section="movie"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V4h-4z"/></svg><span data-t="movies">Movies</span></button>
  <button data-section="series"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6H2v14a2 2 0 0 0 2 2h14v-2H4V6zm16-4H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-8 12.5v-9l6 4.5-6 4.5z"/></svg><span data-t="series">Series</span></button>
  <div class="spacer"></div>
  <div id="session"><span id="left"></span><button id="extend" data-t="extend">+3 h</button></div>
</nav>
<main>
  <header>
    <button id="back" hidden aria-label="Back">‹</button>
    <h1 id="title"></h1>
    <input id="search" type="search" autocomplete="off" placeholder="Search">
    <button id="mode" aria-label="List or tiles"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h8v8H3zm10 0h8v8h-8zM3 13h8v8H3zm10 0h8v8h-8z"/></svg></button>
  </header>
  <div id="content"></div>
</main>
<div id="player" hidden>
  <video id="video" controls autoplay playsinline></video>
  <div id="bar">
    <button id="close" aria-label="Close">✕</button>
    <div><div id="now"></div><div id="next"></div></div>
    <button id="fav" aria-label="Favourite">☆</button>
  </div>
  <div id="error" hidden></div>
</div>
<div id="ended" hidden><div><h2 data-t="endedTitle">Session ended</h2><p data-t="ended">Open a new login link from the gerdTV app: Settings → Account → Web player.</p></div></div>
<footer>gerdTV · GPL-3.0 · hls.js (Apache-2.0) for browsers without built-in HLS</footer>
<script src="/app.js"></script>
</body>
</html>
