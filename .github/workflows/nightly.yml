# Nightly (02:30 UTC) and on demand: the long checks: everything ci.yml's linux job runs, the 30-minute soak and
# the benchmarks (docs/SETUP.md, "CI"). On main the core equals origin/main, so `just bench` here only proves the
# benchmarks run; the 20 % regression gate is `just ready` on the dev machine.
name: nightly

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/flutter
            ~/.pub-cache
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('app/FLUTTER_VERSION', 'Cargo.lock', 'app/pubspec.lock', 'rust-toolchain.toml') }}
          restore-keys: linux-
      - name: System packages
        run: |
          # The runner image's Microsoft package source isn't needed here, and its outage (403, unsigned) failed
          # every apt-get update: only Ubuntu's archive is used.
          grep -rl packages.microsoft.com /etc/apt/sources.list.d | xargs -r sudo rm -f
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev \
            libayatana-appindicator3-dev libsecret-1-dev xvfb xauth just jq
      - run: scripts/ci-install-flutter.sh
      - run: just ci-linux
      - run: just build-linux   # PR CI leaves it to release.yml; the nightly keeps it checked daily
      - run: just soak
      - run: just test-epg-budget
      - run: just bench
