# CI on every pull request push (docs/SETUP.md, "CI"). The job names linux, macos and android are the required
# checks of the main ruleset: renaming one blocks every merge until the ruleset changes too.
# Each job runs only the steps of the areas the change touches (scripts/ci-scope.sh); a job without work ends green
# in seconds. Debug: the scope step prints the changed files and the areas it picked.
name: ci

on:
  pull_request:
  workflow_dispatch:
  # Pushes to main run only the android and warm-caches jobs: they save caches in main's scope, the only scope a
  # release tag or a new branch can restore from (a pull request's caches are visible only to that pull request).
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        run: scripts/ci-scope.sh "${{ github.event.pull_request.base.sha }}"
      # What this job needs: anything (any area but macos/android), Flutter (all but the repo rules alone), gerdTV's
      # own libmpv (the harness on it, the integration tests).
      - id: need
        run: |
          echo "any=${{ steps.scope.outputs.rust == 'true' || steps.scope.outputs.flutter == 'true' || steps.scope.outputs.linux == 'true' || steps.scope.outputs.rules == 'true' }}" >> "$GITHUB_OUTPUT"
          echo "flutter=${{ steps.scope.outputs.rust == 'true' || steps.scope.outputs.flutter == 'true' || steps.scope.outputs.linux == 'true' }}" >> "$GITHUB_OUTPUT"
          echo "libmpv=${{ steps.scope.outputs.rust == 'true' || steps.scope.outputs.linux == 'true' }}" >> "$GITHUB_OUTPUT"
      - if: steps.need.outputs.any == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/flutter
            ~/.pub-cache
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('app/FLUTTER_VERSION', 'Cargo.lock', 'app/pubspec.lock', 'rust-toolchain.toml') }}
          restore-keys: linux-
      - if: steps.need.outputs.any == 'true'
        name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev \
            libayatana-appindicator3-dev libsecret-1-dev xvfb xauth just jq gdb
      # gerdTV's own libmpv (scripts/build-libmpv.sh), rebuilt only when the script changes.
      - if: steps.need.outputs.libmpv == 'true'
        id: libmpv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/libmpv/libgerdmpv.so
            build/libmpv/libgerdmpv.txt
          key: libmpv-linux-${{ hashFiles('scripts/build-libmpv.sh', 'scripts/build-libmpv-container.sh') }}
      - if: steps.need.outputs.libmpv == 'true' && steps.libmpv.outputs.cache-hit != 'true'
        run: scripts/build-libmpv-container.sh build/libmpv
      # For debugging on a dev machine: `gh run download <run> -n libgerdmpv-linux`, then LIBMPV_LIBRARY_PATH.
      - if: steps.need.outputs.libmpv == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libgerdmpv-linux
          path: build/libmpv/libgerdmpv.*
          retention-days: 7
      - if: steps.need.outputs.flutter == 'true'
        run: scripts/ci-install-flutter.sh
      - if: steps.need.outputs.any == 'true'
        run: >-
          just ci-linux ${{ steps.scope.outputs.rust }} ${{ steps.scope.outputs.flutter }}
          ${{ steps.scope.outputs.linux }} ${{ steps.scope.outputs.rules }}

  # gerdTV's own libmpv for macOS and iOS (scripts/build-libmpv-apple.sh), rebuilt only when the script changes, and
  # played once natively before it is cached. Also on pushes to main, so release tags can restore it.
  libmpv-apple:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        run: scripts/ci-scope.sh "${{ github.event.pull_request.base.sha }}"
      - if: steps.scope.outputs.macos == 'true'
        id: libmpv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/libmpv-apple/GerdMpv.xcframework
            build/libmpv-apple/libgerdmpv-apple.txt
          key: libmpv-apple-${{ hashFiles('scripts/build-libmpv-apple.sh') }}
      - if: steps.scope.outputs.macos == 'true' && steps.libmpv.outputs.cache-hit != 'true'
        run: |
          brew install meson ninja pkgconf
          scripts/build-libmpv-apple.sh build/libmpv-apple
          # The macOS slice plays the testkit's clip (scripts/libmpv-smoke.c).
          fw=build/libmpv-apple/GerdMpv.xcframework/macos-arm64
          clang -Ibuild/libmpv-apple/work-macos-arm64/mpv/include scripts/libmpv-smoke.c -F "$fw" -framework GerdMpv \
            -Wl,-rpath,"$PWD/$fw" -o "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke" crates/gerdtv-testkit/media/clip.ts

  macos:
    if: github.event_name != 'push'
    needs: libmpv-apple
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        run: scripts/ci-scope.sh "${{ github.event.pull_request.base.sha }}"
      # The libmpv-apple job's build: the app embeds it (scripts/embed-libmpv-apple.sh).
      - if: steps.scope.outputs.macos == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/libmpv-apple/GerdMpv.xcframework
            build/libmpv-apple/libgerdmpv-apple.txt
          key: libmpv-apple-${{ hashFiles('scripts/build-libmpv-apple.sh') }}
          fail-on-cache-miss: true
      - if: steps.scope.outputs.macos == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/flutter
            ~/.pub-cache
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-${{ hashFiles('app/FLUTTER_VERSION', 'Cargo.lock', 'app/pubspec.lock', 'rust-toolchain.toml') }}
          restore-keys: macos-
      - if: steps.scope.outputs.macos == 'true'
        run: brew install just
      - if: steps.scope.outputs.macos == 'true'
        run: scripts/ci-install-flutter.sh
      - if: steps.scope.outputs.macos == 'true'
        # The main target on every PR: macOS build + integration tests in the runner's GUI session.
        run: just mac-check
      - if: steps.scope.outputs.macos == 'true'
        # The release's first-install DMG, from this build: the packaging script is checked on every PR.
        run: scripts/macos-dmg.sh app/build/macos/Build/Products/Debug/gerdTV.app "$RUNNER_TEMP/check.dmg"
      - if: steps.scope.outputs.macos == 'true'
        # iPhone/iPad: compile the app (Swift platform code included) without signing; no simulator run.
        run: cd app && flutter build ios --debug --no-codesign

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        run: scripts/ci-scope.sh "${{ github.event.pull_request.base.sha }}"
      - if: steps.scope.outputs.android == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - if: steps.scope.outputs.android == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/flutter
            ~/.pub-cache
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
          key: android-${{ hashFiles('app/FLUTTER_VERSION', 'Cargo.lock', 'app/pubspec.lock', 'rust-toolchain.toml') }}
          restore-keys: android-
      - if: steps.scope.outputs.android == 'true'
        run: sudo apt-get install -y -q just
      # gerdTV's own libmpv for Android (scripts/build-libmpv-android.sh), rebuilt only when its scripts change.
      - if: steps.scope.outputs.android == 'true'
        id: libmpv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/libmpv-android/*/libgerdmpv.so
            build/libmpv-android/libgerdmpv-android.txt
          key: libmpv-android-${{ hashFiles('scripts/build-libmpv-android.sh', 'scripts/build-libmpv-android-container.sh') }}
      - if: steps.scope.outputs.android == 'true' && steps.libmpv.outputs.cache-hit != 'true'
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/build-libmpv-android-container.sh build/libmpv-android
      # A new build plays the synthetic clip on an x86_64 emulator before it is cached (scripts/test-libmpv-android.sh).
      - if: steps.scope.outputs.android == 'true' && steps.libmpv.outputs.cache-hit != 'true'
        run: |
          scripts/ci-android-emulator.sh
          ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/test-libmpv-android.sh
      - if: steps.scope.outputs.android == 'true'
        run: scripts/ci-install-flutter.sh
      - if: steps.scope.outputs.android == 'true'
        run: just build-android

  # Main's caches for new branches: a branch restores main's libmpv and linux caches instead of rebuilding libmpv
  # (about 6 min) and the Rust/Flutter dependencies on its first run. Real work only when a cache key changed
  # (lookup-only: a hit downloads nothing).
  warm-caches:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same paths and key as the linux job's, or the linux job can't restore it.
      - id: libmpv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/libmpv/libgerdmpv.so
            build/libmpv/libgerdmpv.txt
          key: libmpv-linux-${{ hashFiles('scripts/build-libmpv.sh', 'scripts/build-libmpv-container.sh') }}
          lookup-only: true
      - if: steps.libmpv.outputs.cache-hit != 'true'
        run: scripts/build-libmpv-container.sh build/libmpv
      # The Android one (same paths and key as the android job's), for release builds and new branches.
      - id: libmpv-android
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/libmpv-android/*/libgerdmpv.so
            build/libmpv-android/libgerdmpv-android.txt
          key: libmpv-android-${{ hashFiles('scripts/build-libmpv-android.sh', 'scripts/build-libmpv-android-container.sh') }}
          lookup-only: true
      - if: steps.libmpv-android.outputs.cache-hit != 'true'
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/build-libmpv-android-container.sh build/libmpv-android
      - id: linux
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/flutter
            ~/.pub-cache
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('app/FLUTTER_VERSION', 'Cargo.lock', 'app/pubspec.lock', 'rust-toolchain.toml') }}
          lookup-only: true
      # A miss: start from main's previous linux cache, build what the linux job builds first, save under the new key.
      - if: steps.linux.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/flutter
            ~/.pub-cache
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('app/FLUTTER_VERSION', 'Cargo.lock', 'app/pubspec.lock', 'rust-toolchain.toml') }}
          restore-keys: linux-
      - if: steps.linux.outputs.cache-hit != 'true'
        name: System packages and Flutter
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev \
            libayatana-appindicator3-dev libsecret-1-dev
          scripts/ci-install-flutter.sh
      # A step of its own: Flutter's PATH entry (GITHUB_PATH) takes effect from the next step on.
      - if: steps.linux.outputs.cache-hit != 'true'
        name: Build the dependencies
        run: |
          cargo clippy --workspace --all-targets --quiet
          cargo test --workspace --no-run --quiet
          (cd app && flutter pub get)
      - if: steps.linux.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/flutter
            ~/.pub-cache
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('app/FLUTTER_VERSION', 'Cargo.lock', 'app/pubspec.lock', 'rust-toolchain.toml') }}
