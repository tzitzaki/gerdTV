# CI on every pull request push (docs/SETUP.md, "CI"). The job names linux, macos and android are the required
# checks of the main ruleset: renaming one blocks every merge until the ruleset changes too.
# Each job's first step ends it green at once when only *.md files changed (scripts/ci-scope.sh).
name: ci

on:
  pull_request:
  workflow_dispatch:
  # Pushes to main run only the android job: it saves the Gradle/pub/cargo cache in main's scope, the only scope a
  # release tag can restore from (caches saved by pull requests are invisible to tag runs).
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        run: scripts/ci-scope.sh "${{ github.event.pull_request.base.sha }}"
      - if: steps.scope.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/flutter
            ~/.pub-cache
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('app/FLUTTER_VERSION', 'Cargo.lock', 'app/pubspec.lock', 'rust-toolchain.toml') }}
          restore-keys: linux-
      - if: steps.scope.outputs.code == 'true'
        name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev \
            libayatana-appindicator3-dev libsecret-1-dev xvfb xauth just jq gdb \
            meson nasm patchelf python3-jinja2 libass-dev libva-dev libdrm-dev libegl-dev libgl-dev libpulse-dev \
            libasound2-dev libgnutls28-dev zlib1g-dev \
            libwayland-dev libwayland-bin wayland-protocols libxkbcommon-dev libdisplay-info-dev
      # gerdTV's own libmpv (scripts/build-libmpv.sh), rebuilt only when the script changes.
      - if: steps.scope.outputs.code == 'true'
        id: libmpv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            build/libmpv/libgerdmpv.so
            build/libmpv/libgerdmpv.txt
          key: libmpv-linux-${{ hashFiles('scripts/build-libmpv.sh') }}
      - if: steps.scope.outputs.code == 'true' && steps.libmpv.outputs.cache-hit != 'true'
        run: scripts/build-libmpv.sh build/libmpv
      # For debugging on a dev machine: `gh run download <run> -n libgerdmpv-linux`, then LIBMPV_LIBRARY_PATH.
      - if: steps.scope.outputs.code == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libgerdmpv-linux
          path: build/libmpv/libgerdmpv.*
          retention-days: 7
      - if: steps.scope.outputs.code == 'true'
        run: scripts/ci-install-flutter.sh
      - if: steps.scope.outputs.code == 'true'
        run: just ci-linux

  macos:
    if: github.event_name != 'push'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        run: scripts/ci-scope.sh "${{ github.event.pull_request.base.sha }}"
      - if: steps.scope.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/flutter
            ~/.pub-cache
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-${{ hashFiles('app/FLUTTER_VERSION', 'Cargo.lock', 'app/pubspec.lock', 'rust-toolchain.toml') }}
          restore-keys: macos-
      - if: steps.scope.outputs.code == 'true'
        run: brew install just
      - if: steps.scope.outputs.code == 'true'
        run: scripts/ci-install-flutter.sh
      - if: steps.scope.outputs.code == 'true'
        # The main target on every PR: macOS build + integration tests in the runner's GUI session.
        run: just mac-check
      - if: steps.scope.outputs.code == 'true'
        # The release's first-install DMG, from this build: the packaging script is checked on every PR.
        run: scripts/macos-dmg.sh app/build/macos/Build/Products/Debug/gerdTV.app "$RUNNER_TEMP/check.dmg"
      - if: steps.scope.outputs.code == 'true'
        # iPhone/iPad: compile the app (Swift platform code included) without signing; no simulator run.
        run: cd app && flutter build ios --debug --no-codesign

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        run: scripts/ci-scope.sh "${{ github.event.pull_request.base.sha }}"
      - if: steps.scope.outputs.code == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - if: steps.scope.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/flutter
            ~/.pub-cache
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
          key: android-${{ hashFiles('app/FLUTTER_VERSION', 'Cargo.lock', 'app/pubspec.lock', 'rust-toolchain.toml') }}
          restore-keys: android-
      - if: steps.scope.outputs.code == 'true'
        run: sudo apt-get install -y -q just
      - if: steps.scope.outputs.code == 'true'
        run: scripts/ci-install-flutter.sh
      - if: steps.scope.outputs.code == 'true'
        run: just build-android
