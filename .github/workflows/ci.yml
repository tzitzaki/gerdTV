# CI on every pull request push (docs/SETUP.md, "CI"). The job names linux, macos and android are the required
# checks of the main ruleset: renaming one blocks every merge until the ruleset changes too.
# Each job's first step ends it green at once when only *.md files changed (scripts/ci-scope.sh).
name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        run: scripts/ci-scope.sh "${{ github.event.pull_request.base.sha }}"
      - if: steps.scope.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/flutter
            ~/.pub-cache
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-${{ hashFiles('app/FLUTTER_VERSION', 'Cargo.lock', 'app/pubspec.lock', 'rust-toolchain.toml') }}
          restore-keys: linux-
      - if: steps.scope.outputs.code == 'true'
        name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev \
            libayatana-appindicator3-dev libsecret-1-dev xvfb xauth just jq
      - if: steps.scope.outputs.code == 'true'
        run: scripts/ci-install-flutter.sh
      - if: steps.scope.outputs.code == 'true'
        run: just ci-linux

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        run: scripts/ci-scope.sh "${{ github.event.pull_request.base.sha }}"
      - if: steps.scope.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/flutter
            ~/.pub-cache
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-${{ hashFiles('app/FLUTTER_VERSION', 'Cargo.lock', 'app/pubspec.lock', 'rust-toolchain.toml') }}
          restore-keys: macos-
      - if: steps.scope.outputs.code == 'true'
        run: brew install just
      - if: steps.scope.outputs.code == 'true'
        run: scripts/ci-install-flutter.sh
      - if: steps.scope.outputs.code == 'true'
        # The main target on every PR: macOS build + integration tests in the runner's GUI session.
        run: just mac-check
      - if: steps.scope.outputs.code == 'true'
        # iPhone/iPad: compile the app (Swift platform code included) without signing; no simulator run.
        run: cd app && flutter build ios --debug --no-codesign

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: scope
        run: scripts/ci-scope.sh "${{ github.event.pull_request.base.sha }}"
      - if: steps.scope.outputs.code == 'true'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "21"
      - if: steps.scope.outputs.code == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/flutter
            ~/.pub-cache
            ~/.cargo/registry
            ~/.cargo/git
            ~/.gradle/caches
          key: android-${{ hashFiles('app/FLUTTER_VERSION', 'Cargo.lock', 'app/pubspec.lock', 'rust-toolchain.toml') }}
          restore-keys: android-
      - if: steps.scope.outputs.code == 'true'
        run: sudo apt-get install -y -q just
      - if: steps.scope.outputs.code == 'true'
        run: scripts/ci-install-flutter.sh
      - if: steps.scope.outputs.code == 'true'
        run: just build-android
