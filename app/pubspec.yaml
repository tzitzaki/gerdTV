name: gerdtv
description: "gerdTV: a multi-platform IPTV player (Flutter + Rust + libmpv)."
publish_to: 'none'
# Set by each wrap-up release: 0.YYMMDD.<PR#>+<PR#> (docs/RELEASING.md).
version: 0.261128.71+71

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_ui: ^1.1.0 # the iOS page slide with edge swipe-back on phones (material_ui already pulls it in)
  file_selector: 1.1.0 # Settings → Account → Your data: open a file everywhere, save on macOS/Linux (owner decision)
  flutter_local_notifications: 22.3.3 # reminders; 23.x needs compileSdk 37 (Flutter's default is 36)
  flutter_rust_bridge: 2.13.0
  flutter_secure_storage: ^11.2.0
  gerdtv_api:
    path: rust_builder
  gerdtv_avplayer: # the AVPlayer engine for live channels on iOS and macOS (lib/player/av_player.dart)
    path: packages/gerdtv_avplayer
  intl: any
  material_ui: ^1.1.0
  media_kit: 1.2.6 # exact: an upstream release must not change playback unnoticed (DECISIONS)
  media_kit_libs_video: 1.0.7
  media_kit_video: 2.0.1
  path_provider: ^2.1.6
  share_plus: 13.3.1 # Settings → Account → Your data: hands the export to iOS's share sheet (owner decision)
  timezone: 0.11.2 # flutter_local_notifications schedules with TZDateTime (reminders use UTC)
  window_manager: ^0.7.0
  webview_flutter: ^4.14.1
  webview_flutter_android: ^4.14.1
  webview_flutter_wkwebview: ^3.27.2

# media_kit's video plugin, vendored and patched (owner decision; third_party/README.md): on macOS and iOS it looks
# up libmpv at run time, so the app can load media_kit's or gerdTV's own. Same version as above.
dependency_overrides:
  media_kit_video:
    path: ../third_party/media_kit_video

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Shown on the Licences screen next to the Dart packages (lib/licences.dart; scripts/licences.sh keeps rust.txt).
    - assets/licences/
    # The macOS update swap, run after the app quits (lib/platform/mac_install.dart).
    - assets/update/
    # TMDB's approved logo for the attribution in About (its SVG "Primary short (blue)", rendered unaltered at 4x).
    - assets/tmdb/
