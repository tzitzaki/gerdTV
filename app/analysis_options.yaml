# flutter analyze runs in CI and `just ready` and must report nothing.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - macos/**
    - linux/**
    - rust_builder/cargokit/**
    # Generated by gen-l10n, which still emits the pre-material_ui delegates (deprecated_member_use infos).
    - lib/l10n/gen/**
